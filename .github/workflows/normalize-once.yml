name: normalize-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/normalize-once.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Normalize Rust tree
        run: |
          cargo generate-lockfile
          cargo fmt --all
          rm .github/workflows/normalize-once.yml

      - name: Commit normalized tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to normalize."
            exit 0
          fi
          git commit -m "Normalize Rust tree"
          git push origin HEAD:main
