[package]
name = "lexwright"
version = "0.1.0"
edition = "2024"
publish = false
description = "An ephemeral keyboard-first scratchpad with programmable text expansion"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
harper-core = { version = "=2.11.0", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
